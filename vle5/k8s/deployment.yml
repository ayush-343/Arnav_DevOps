apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
spec:
  replicas: 2
  selector:
    matchLabels: {app: devops}
  template:
    metadata:
      labels: {app: devops}
    spec:
      containers:
        - name: devops-container
          image: devops-lab-app:lab
          imagePullPolicy: Never
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
