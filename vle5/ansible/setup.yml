- name: Configure VLE5 Kubernetes server
  hosts: server1
  become: true
  tasks:
    - name: Install Docker and required tools
      ansible.builtin.dnf:
        name: [docker, conntrack-tools, iproute-tc, socat]
        state: present
    - name: Start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
    - name: Allow ec2 user to run Docker
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true
